<!DOCTYPE html>
<html lang="ru">
<head>

<style>
  *{margin:0;padding:0;box-sizing:border-box}
body{background:#f0f2f5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#222}
header{background:#fff;padding:15px 40px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e5e7eb}
.container{max-width:1400px;margin:30px auto;padding:0 20px}
.btn-primary{background:#00aaff;color:#fff;padding:12px 20px;border:none;border-radius:8px}
img{max-width:100%;height:auto;display:block}
</style>


<link rel="preload"  href="style.css" as="style">
<link rel="stylesheet"  href="style.css" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet"  href="style.css"></noscript>

<script src="script.js"></script>



</head>
<body>
    <header>
        <div class="logo">Board</div>
        <nav>
            <a href="index.html">Главная</a>
            <a href="category.html">Категории</a>
            <a href="about.html">О сайте</a>
            <span id="authLinks"></span>
        </nav>
    </header>

    <div class="container">
        <div class="activate-box">
            <h2>Активация аккаунта</h2>
            <p>Введите код, полученный при регистрации</p>
            <input type="text" id="activationCode" placeholder="Код активации (6 символов)" maxlength="6">
            <button onclick="activateAccount()">Активировать</button>
            <p class="info-text">Если вы не получили код, проверьте email или зарегистрируйтесь заново</p>
        </div>
    </div>

    
    <script>// Автоматически подставляем код из URL в поле ввода
const urlParams = new URLSearchParams(window.location.search);
const codeFromUrl = urlParams.get('code');
if (codeFromUrl) {
    const input = document.getElementById('activationCode');
    if (input) input.value = codeFromUrl;
    showNotification('Код активации автоматически вставлен', 'info', 'Осталось нажать кнопку');
}</script>
</body>
</html>

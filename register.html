<!DOCTYPE html>
<html lang="ru"> 
<head>

<style>
  *{margin:0;padding:0;box-sizing:border-box}
body{background:#f0f2f5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#222}
header{background:#fff;padding:15px 40px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #e5e7eb}
.container{max-width:1400px;margin:30px auto;padding:0 20px}
.btn-primary{background:#00aaff;color:#fff;padding:12px 20px;border:none;border-radius:8px}
img{max-width:100%;height:auto;display:block}
</style>


<link rel="preload" href="style.min.css" as="style">
<link rel="stylesheet" href="style.min.css" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="style.min.css"></noscript>


<script src="script.min.js" defer></script>

</head>
<body>
    <header>
        <div class="logo">Board</div>
        <nav>
            <a href="index.html">Главная</a>
            <a href="category.html">Категории</a>
            <a href="about.html">О сайте</a>
            <span id="authLinks"></span>
        </nav>
    </header>
    
    <div class="container">
        <div class="register-box">
            <h2>Регистрация</h2> 
            
<input type="text" id="username" placeholder="Имя пользователя">
<div id="usernameError" class="error-message" style="color: red; font-size: 12px; display: none;"></div>

<input type="email" id="email" placeholder="Email" onblur="validateEmailField()">
<div id="emailError" class="error-message" style="color: red; font-size: 12px; display: none;"></div>

<input type="password" id="password" placeholder="Пароль" oninput="checkPasswordStrength(this.value)">
<div id="passwordStrength" style="font-size: 12px; margin-top: 5px;"></div>

<input type="password" id="passwordtwo" placeholder="Повторите пароль">
<div id="passwordRepeatError" class="error-message" style="color: red; font-size: 12px; display: none;"></div>
            <p class="text-center">
                Уже есть аккаунт? <a href="login.html">Войти</a>
            </p>
        </div> 
    </div>
    
    
</body>
</html>

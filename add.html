<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Добавить объявление | Доска объявлений</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">Board</div>
        <nav>
            <a href="index.html">Главная</a>
            <a href="category.html">Категории</a>
            <a href="about.html">О сайте</a>
            <span id="authLinks"></span>
        </nav>
    </header>

    <div class="container">
        <div class="form-container">
            <h2>Добавить объявление</h2>
            
            <form id="addAdForm">
                <div class="form-group">
                    <label for="title">Название объявления *</label>
                    <input type="text" id="title" placeholder="Например: Продам iPhone 13" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="category">Категория *</label>
                        <select id="category" required>
                            <option value="">Выберите категорию</option>
                            <option value="Электроника">📱 Электроника</option>
                            <option value="Недвижимость">🏠 Недвижимость</option>
                            <option value="Транспорт">🚗 Транспорт</option>
                            <option value="Работа">💼 Работа</option>
                            <option value="Услуги">🔧 Услуги</option>
                            <option value="Спорт">⚽ Спорт</option>
                            <option value="Одежда">👕 Одежда</option>
                            <option value="Другое">📦 Другое</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="price">Цена *</label>
                        <input type="text" id="price" placeholder="Например: 50000 ₽" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="description">Описание *</label>
                    <textarea id="description" placeholder="Подробно опишите товар или услугу..." required></textarea>
                </div>

                <div class="form-group">
                    <label for="image">Ссылка на фото</label>
                    <input type="url" id="image" placeholder="https://example.com/photo.jpg">
                    <img id="preview" class="preview-image" alt="Предпросмотр">
                </div>

                <div class="form-group">
                    <label for="phone">Контактный телефон</label>
                    <input type="tel" id="phone" placeholder="+7 (999) 123-45-67">
                </div>

                <button type="submit" class="submit-btn">Опубликовать объявление</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
